name: Trivy ACR image scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/trivy-acr-image-scan.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'src/**'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy-acr-scan:
    runs-on: ubuntu-latest
    env:
      ACR_NAME:         itaasacr
      ACR_LOGIN_SERVER: itaasacr.azurecr.io
      IMAGE_REPOSITORY: ubuntu-distro
      IMAGE_TAG:        24.04_distro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate workflow configuration
        run: |
          test -n "$ACR_NAME" || {
            echo "Set the ACR_NAME variable or provide the acr_name workflow input."
            exit 1
          }
          test -n "$IMAGE_REPOSITORY" || {
            echo "Set the ACR_IMAGE_REPOSITORY variable or provide the image_repository workflow input."
            exit 1
          }

      - name: Authenticate to Azure
        uses: Azure/login@v3.0.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
        env:
          TRIVY_USERNAME: trivyscangithubaction
          TRIVY_PASSWORD: ${{ secrets.ACR_CREDENTIALS }}

      - name: Upload Trivy scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
